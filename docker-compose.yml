services:
  dummy:
    image: bash:latest
    scale: 0

  test:
    image: bash:latest
    #scale: 0
    restart: no
#    deploy:
#      #mode: global
#      restart_policy:
#        condition: none
    entrypoint: ["sh", "-ec"]
    environment:
      TZ: Europe/Berlin
      ID: 1
    configs:
      - test
    command:
      - |
        echo "Hello world!"
        date
        ls -l /
        cat /test
        sleep 10
        echo done sleeping
    labels:
      cd.doco.job.enabled: "true"
      cd.doco.job.schedule: "@every 30s"
      #cd.doco.job.skip_running: "false"
      cd.doco.job.execution_mode: restart
      cd.doco.job.stop_services: "nginx"

  nginx:
    image: nginx:latest

configs:
  test:
    content: test